services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teztap}
      POSTGRES_USER: ${POSTGRES_USER:-teztap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - teztap-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-teztap}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-teztap}
      PGSSLMODE: disable
      PGSSL_REJECT_UNAUTHORIZED: "true"
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in deploy/.env}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-604800}
      MERCORA_DEMO_MODE: ${MERCORA_DEMO_MODE:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-flash-lite-latest,gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-flash-latest}
      TWOGIS_API_KEY: ${TWOGIS_API_KEY:-}
      TWOGIS_API_URL: ${TWOGIS_API_URL:-https://catalog.api.2gis.com/3.0/items}
      TWOGIS_ROUTING_API_URL: ${TWOGIS_ROUTING_API_URL:-https://routing.api.2gis.com}
      TWOGIS_MAX_RESULTS: ${TWOGIS_MAX_RESULTS:-0}
      TWOGIS_ENABLE_TILING: ${TWOGIS_ENABLE_TILING:-true}
      TWOGIS_TILE_GRID_SIZE: ${TWOGIS_TILE_GRID_SIZE:-5}
      TWOGIS_PAGE_SIZE: ${TWOGIS_PAGE_SIZE:-50}
      TWOGIS_REQUEST_GAP_MS: ${TWOGIS_REQUEST_GAP_MS:-1100}
      TWOGIS_CACHE_TTL_MS: ${TWOGIS_CACHE_TTL_MS:-300000}
      TWOGIS_PLATFORM_CACHE_TTL_MS: ${TWOGIS_PLATFORM_CACHE_TTL_MS:-60000}
      OVERPASS_URLS: ${OVERPASS_URLS:-https://overpass-api.de/api/interpreter,https://overpass.kumi.systems/api/interpreter}
      OVERPASS_TIMEOUT_MS: ${OVERPASS_TIMEOUT_MS:-7000}
      OVERPASS_CACHE_TTL_MS: ${OVERPASS_CACHE_TTL_MS:-300000}
      OVERPASS_REQUEST_GAP_MS: ${OVERPASS_REQUEST_GAP_MS:-1100}
      GEO_CACHE_TTL_MS: ${GEO_CACHE_TTL_MS:-300000}
      GEO_REQUEST_GAP_MS: ${GEO_REQUEST_GAP_MS:-1100}
      NEIGHBORHOOD_OVERPASS_URL: ${NEIGHBORHOOD_OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      PUBLIC_GEO_DATA_URL: ${PUBLIC_GEO_DATA_URL:-}
      PUBLIC_GEO_DATA_NAME: ${PUBLIC_GEO_DATA_NAME:-}
      ORGANIZATION_GEO_DATA_URL: ${ORGANIZATION_GEO_DATA_URL:-}
      ORGANIZATION_GEO_DATA_NAME: ${ORGANIZATION_GEO_DATA_NAME:-}
      PRICE_MODERATOR_EMAILS: ${PRICE_MODERATOR_EMAILS:-}
      PRICE_OBSERVATION_DAILY_LIMIT: ${PRICE_OBSERVATION_DAILY_LIMIT:-20}
      PROPERTY_MODERATOR_EMAILS: ${PROPERTY_MODERATOR_EMAILS:-}
      PROPERTY_OWNER_DAILY_LIMIT: ${PROPERTY_OWNER_DAILY_LIMIT:-20}
      PROPERTY_SEARCH_RADIUS_KM: ${PROPERTY_SEARCH_RADIUS_KM:-5}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-90}
      API_RATE_WINDOW_MS: ${API_RATE_WINDOW_MS:-60000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://api:5000
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  teztap-postgres:
