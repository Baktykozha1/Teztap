# TezTap MVP deployment on Render + Vercel
# The free Render Postgres plan is temporary (it expires after 30 days).
# Upgrade the database plan before storing important or production user data.
services:
  - type: web
    name: teztap-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: teztap-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: TWOGIS_API_KEY
        sync: false
      - key: TWOGIS_MAPGL_KEY
        sync: false
      - key: TWOGIS_ENABLE_TILING
        value: "true"
      - key: TWOGIS_TILE_GRID_SIZE
        value: "5"
      - key: TWOGIS_MAX_RESULTS
        value: "0"
      - key: TWOGIS_PAGE_SIZE
        value: "50"

databases:
  - name: teztap-db
    databaseName: teztap
    user: teztap
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []
